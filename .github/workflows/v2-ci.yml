name: v2 CI

on:
  push:
    branches:
      - cloudrun-v2
    paths:
      - "v2/**"
      - "template_parts/**"
      - "legacy_quarter_app.py"
      - "data/manual_addresses.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/v2-ci.yml"
  pull_request:
    paths:
      - "v2/**"
      - "template_parts/**"
      - "legacy_quarter_app.py"
      - "data/manual_addresses.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/v2-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r v2/backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q v2/backend/app

      - name: Import FastAPI app
        env:
          ADDRESS_CACHE_BACKEND: memory
        run: PYTHONPATH=v2/backend python -c "from app.main import app; print(app.title)"

      - name: Run backend unit tests
        env:
          ADDRESS_CACHE_BACKEND: memory
        run: PYTHONPATH=v2/backend python -m unittest discover -s v2/backend/tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: v2/frontend
        run: npm install

      - name: Build frontend
        working-directory: v2/frontend
        run: npm run build

      - name: Build production Docker image
        run: docker build -t local-economy-report-v2:ci .

      - name: Smoke test quarterly template inside production image
        run: >-
          docker run --rm local-economy-report-v2:ci
          python -c "from app.quarter_service import _load_quarter_template_bytes; data=_load_quarter_template_bytes(); assert data.startswith(b'PK\\x03\\x04'); print('quarter template ok', len(data))"

      - name: Smoke test legacy manual address snapshot inside production image
        run: >-
          docker run --rm local-economy-report-v2:ci
          python -c "import json; data=json.load(open('/app/data/manual_addresses.json', encoding='utf-8')); assert data['3120813966']['company_name']=='전진유리'; print('legacy manual address snapshot ok', len(data))"
