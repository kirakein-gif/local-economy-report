name: v2 CI

on:
  push:
    branches:
      - cloudrun-v2
    paths:
      - "v2/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/v2-ci.yml"
  pull_request:
    paths:
      - "v2/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/v2-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r v2/backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q v2/backend/app

      - name: Import FastAPI app
        env:
          ADDRESS_CACHE_BACKEND: memory
        run: PYTHONPATH=v2/backend python -c "from app.main import app; print(app.title)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: v2/frontend
        run: npm install

      - name: Build frontend
        working-directory: v2/frontend
        run: npm run build
